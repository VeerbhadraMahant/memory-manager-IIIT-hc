# Local stack: Postgres+pgvector and the API.   docker compose up --build
# The database is local and disposable — use this instead of a Supabase project while
# developing. For the production-shaped, secrets-from-files layout see deploy/.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nam
      POSTGRES_PASSWORD: nam
      POSTGRES_DB: nam
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nam -d nam"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    env_file:
      - path: .env        # optional: LLM_API_KEY, GROQ_API_KEY, ...
        required: false
    environment:
      # Overrides any DATABASE_URL in .env so this stack never touches a real project.
      DATABASE_URL: postgresql://nam:nam@db:5432/nam
      ENVIRONMENT: development
      LOG_JSON: "false"
      RUN_MIGRATIONS: "true"
      AUTH_REQUIRED: "false"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      FORWARDED_ALLOW_IPS: "*"
    ports: ["127.0.0.1:8000:8000"]

volumes:
  pgdata:
